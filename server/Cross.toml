# VibeDesk: Konfiguration für `cross` (Workflow vibedesk-server.yml).
# hbb_common ist auch Build-Abhängigkeit und braucht dafür OpenSSL des
# Build-Hosts. Das OpenSSL für das Ziel baut openssl-src, das dafür Perl braucht.
[build]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config perl make",
]
