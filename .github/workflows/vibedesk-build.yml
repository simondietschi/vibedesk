name: VibeDesk Build

# Baut VibeDesk-Clients mit fest eingebautem eigenem Server.
#
# Server und Schlüssel kommen aus den Eingaben beim manuellen Start oder,
# falls leer, aus den Repository-Variablen VIBEDESK_RENDEZVOUS_SERVER,
# VIBEDESK_RS_PUB_KEY und optional VIBEDESK_API_SERVER
# (Settings > Secrets and variables > Actions > Variables).
# Ein Tag v* oder die Eingabe release_tag legt zusätzlich einen Release-Entwurf an.

on:
  workflow_dispatch:
    inputs:
      rendezvous_server:
        description: "ID-Server (hbbs), z.B. desk.example.ch"
        type: string
        default: ""
      rs_pub_key:
        description: "Inhalt von id_ed25519.pub des Servers"
        type: string
        default: ""
      api_server:
        description: "Optional: API-Server der Konsole, z.B. https://konsole.example.ch"
        type: string
        default: ""
      release_tag:
        description: "Optional: Release-Entwurf mit diesem Tag anlegen, z.B. v1.5.1"
        type: string
        default: ""
      linux:
        description: "Linux (deb) bauen"
        type: boolean
        default: true
      windows:
        description: "Windows (exe, msi) bauen"
        type: boolean
        default: true
      android:
        description: "Android (apk) bauen"
        type: boolean
        default: true
      macos:
        description: "macOS (dmg) bauen"
        type: boolean
        default: true
      ios:
        description: "iOS (unsignierte ipa) bauen"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  LLVM_VERSION: "15.0.6"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Git-Abhängigkeiten über GitHub brechen gelegentlich ab, Cargo soll es erneut versuchen.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  VIBEDESK_RENDEZVOUS_SERVER: ${{ inputs.rendezvous_server || vars.VIBEDESK_RENDEZVOUS_SERVER }}
  VIBEDESK_RS_PUB_KEY: ${{ inputs.rs_pub_key || vars.VIBEDESK_RS_PUB_KEY }}
  VIBEDESK_API_SERVER: ${{ inputs.api_server || vars.VIBEDESK_API_SERVER }}

jobs:
  bridge:
    name: Flutter-Rust-Bridge generieren
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Systempakete installieren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge
          workspaces: client

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Bridge-Werkzeuge installieren
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features "uuid" --locked
          # extended_text 14 braucht ein neueres Dart als Flutter 3.22.3 mitbringt.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Bridge generieren
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge
          path: |
            client/src/bridge_generated.rs
            client/src/bridge_generated.io.rs
            client/flutter/lib/generated_bridge.dart
            client/flutter/lib/generated_bridge.freezed.dart
            client/flutter/macos/Runner/bridge_generated.h
            client/flutter/ios/Runner/bridge_generated.h

  linux:
    name: Linux x86_64
    needs: bridge
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - name: Cache-Variablen für vcpkg freigeben
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Platz schaffen
        working-directory: .
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          df -h /

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Systempakete installieren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ nasm ninja-build pkg-config python3 rpm unzip wget xz-utils \
            libayatana-appindicator3-dev libasound2-dev libclang-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libssl-dev libunwind-dev \
            libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: linux
          workspaces: client

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /home/runner/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten installieren
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "== $1"; tail -n 50 "$1"' _ {} \;
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: client

      - name: Rust-Bibliothek bauen
        run: |
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml
          cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter patchen
        run: |
          patch="$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          # Der Flutter-Cache kann den Patch schon enthalten.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch ist bereits angewendet"
          else
            git apply "$patch"
          fi

      - name: Paket bauen
        run: |
          export DEB_ARCH=amd64
          python3 ./build.py --flutter --skip-cargo
          for name in vibedesk-*.deb; do mv "$name" "${name%.deb}-x86_64.deb"; done
          ls -l vibedesk-*.deb

      - name: Paket prüfen
        run: |
          deb=$(ls vibedesk-*.deb | head -n 1)
          dpkg-deb -c "$deb" | awk '{print $6}' > files.txt
          for f in ./usr/share/vibedesk/vibedesk ./usr/share/vibedesk/lib/libvibedesk.so \
                   ./usr/share/vibedesk/files/systemd/vibedesk.service \
                   ./usr/share/applications/vibedesk.desktop ./usr/share/icons/hicolor/256x256/apps/vibedesk.png; do
            grep -qx "$f" files.txt || { echo "fehlt im Paket: $f"; exit 1; }
          done
          dpkg-deb -f "$deb" Package | grep -qx vibedesk
          if [ -n "$VIBEDESK_RENDEZVOUS_SERVER" ]; then
            grep -q --fixed-strings "$VIBEDESK_RENDEZVOUS_SERVER" target/release/liblibvibedesk.so \
              || { echo "Server ist nicht im Binary eingebaut"; exit 1; }
          fi
          rm files.txt

      # Paket für Arch Linux aus demselben Build. makepkg läuft nicht als root,
      # darum ein Benutzer mit der UID des Runners. Danach wird das Paket in
      # einem frischen Arch installiert und auf fehlende Bibliotheken geprüft.
      - name: Arch-Paket bauen und prüfen
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          sed -i "s/^pkgver=.*/pkgver=${version}/" res/PKGBUILD
          docker run --rm -v "$PWD:/src" -e HOST_UID="$(id -u)" archlinux:base-devel bash -euc '
            useradd -m -u "$HOST_UID" builder
            su builder -c "cd /src/res && HBB=/src FLUTTER=1 makepkg -f --nodeps"
            pacman -Syu --noconfirm
            pacman -U --noconfirm /src/res/vibedesk-*.pkg.tar.zst || true
            pacman -Q vibedesk
            missing=$(ldd /usr/share/vibedesk/vibedesk /usr/share/vibedesk/lib/*.so | grep "not found" | sort -u || true)
            if [ -n "$missing" ]; then echo "Fehlende Bibliotheken:"; echo "$missing"; exit 1; fi
          '
          mv res/vibedesk-*.pkg.tar.zst "vibedesk-${version}-x86_64.pkg.tar.zst"
          ls -l vibedesk-*.pkg.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibedesk-linux-x86_64
          path: |
            client/vibedesk-*.deb
            client/vibedesk-*.pkg.tar.zst
          if-no-files-found: error

  topmost:
    name: Windows-Hilfsprogramm TopMostWindow
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Quellcode holen und bauen
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow topmost
          cd topmost
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmost-x64
          path: topmost/WindowInjection/x64/Release/WindowInjection.dll
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [bridge, topmost]
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-2022
    defaults:
      run:
        working-directory: client
    steps:
      - name: Cache-Variablen für vcpkg freigeben
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: client

      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Flutter patchen
        shell: bash
        run: |
          patch="$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          # Der Flutter-Cache kann den Patch schon enthalten.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch ist bereits angewendet"
          else
            git apply "$patch"
          fi

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows
          workspaces: client

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten installieren
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "== $1"; tail -n 50 "$1"' _ {} \;
            exit 1
          fi

      - name: Client bauen
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./vibedesk

      - name: Programm prüfen
        run: |
          $out = (& ".\vibedesk\vibedesk.exe" --version | Out-String).Trim()
          Write-Host "vibedesk --version: $out"
          if (-not $out) { throw "vibedesk.exe --version lieferte nichts" }

      - name: Treiber hinzufügen
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sSL --fail -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          # Treiber für virtuelle Bildschirme
          fetch https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip usbmmidd_v2.zip \
            629b51e9944762bae73948171c65d09a79595cf4c771a82ebc003fbba5b24f51
          unzip -q usbmmidd_v2.zip
          rm -rf usbmmidd_v2/Win32 usbmmidd_v2/deviceinstaller64.exe usbmmidd_v2/deviceinstaller.exe usbmmidd_v2/usbmmidd.bat
          mv usbmmidd_v2 ./vibedesk/
          # Treiber für den entfernten Drucker
          base=https://github.com/rustdesk/hbb_common/releases/download/driver
          fetch "$base/rustdesk_printer_driver_v4-1.4.zip" printer_driver.zip \
            c4cf4d3b48c4d9079b243edc43bb1db03b076282bc259c9f49883e9db20fa8b5
          fetch "$base/printer_driver_adapter.zip" printer_driver_adapter.zip \
            e90e5d52c8807b4c6293c78a52479338715e0bf396b1b34802777b8c452e6781
          unzip -q printer_driver.zip
          mkdir -p ./vibedesk/drivers
          mv rustdesk_printer_driver_v4-1.4 ./vibedesk/drivers/RustDeskPrinterDriver
          unzip -q printer_driver_adapter.zip -d ./vibedesk/
          rm -f usbmmidd_v2.zip printer_driver.zip printer_driver_adapter.zip

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmost-x64
          path: client/vibedesk

      - name: Ressourcen für den Portable-Packer übernehmen
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -n 1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      - name: Selbstentpackende exe bauen
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../vibedesk/ -o . -e ../../vibedesk/vibedesk.exe
          popd
          mkdir -p ./dist
          mv ./target/release/vibedesk-portable-packer.exe "./dist/vibedesk-${version}-x86_64.exe"

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: MSI bauen
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          pushd ./res/msi
          python preprocess.py --arp -d ../../vibedesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mv $msi.FullName "./dist/vibedesk-$version-x86_64.msi"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibedesk-windows-x64
          path: client/dist/*
          if-no-files-found: error

  android-lib:
    name: Android-Bibliothek ${{ matrix.target }}
    needs: bridge
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-android, abi: arm64-v8a, script: ndk_arm64.sh }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a, script: ndk_arm.sh }
          - { target: x86_64-linux-android, abi: x86_64, script: ndk_x64.sh }
    defaults:
      run:
        working-directory: client
    steps:
      - name: Platz schaffen
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Cache-Variablen für vcpkg freigeben
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Systempakete installieren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib libc6-dev libclang-dev llvm-dev \
            libasound2-dev libgtk-3-dev libpulse-dev libunwind-dev libva-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm ninja-build pkg-config wget

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /home/runner/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten installieren
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABI: ${{ matrix.abi }}
        run: |
          if ! ./flutter/build_android_deps.sh "$ABI"; then
            find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "== $1"; tail -n 50 "$1"' _ {} \;
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: client

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: android
          key: ${{ matrix.target }}
          workspaces: client

      - name: Rust-Bibliothek bauen
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          SCRIPT: ${{ matrix.script }}
          TARGET: ${{ matrix.target }}
          ABI: ${{ matrix.abi }}
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          "./flutter/$SCRIPT"
          mkdir -p "jni/$ABI"
          cp "./target/$TARGET/release/liblibvibedesk.so" "jni/$ABI/libvibedesk.so"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$(echo "$TARGET" | sed 's/armv7-linux-androideabi/arm-linux-androideabi/')/libc++_shared.so" "jni/$ABI/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lib-${{ matrix.abi }}
          path: client/jni
          if-no-files-found: error

  android:
    name: Android APK
    needs: android-lib
    runs-on: ubuntu-24.04
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Java installieren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk-headless

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter patchen
        run: |
          patch="$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          # Der Flutter-Cache kann den Patch schon enthalten.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch ist bereits angewendet"
          else
            git apply "$patch"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: client

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: android-lib-*
          merge-multiple: true
          path: client/flutter/android/app/src/main/jniLibs

      - name: APK bauen
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Ohne eigenen Schlüssel mit dem Debug-Schlüssel signieren, damit die APK installierbar ist.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64
          popd
          mkdir -p dist
          mv ./flutter/build/app/outputs/flutter-apk/app-release.apk "dist/vibedesk-${version}-universal.apk"

      - name: Signier-Tools ermitteln
        if: env.ANDROID_SIGNING_KEY != ''
        run: echo "ANDROID_SIGN_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> "$GITHUB_ENV"

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: APK mit eigenem Schlüssel signieren
        if: env.ANDROID_SIGNING_KEY != ''
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}
        with:
          releaseDirectory: client/dist
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibedesk-android
          path: client/dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: bridge
    if: github.event_name == 'push' || inputs.macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: macos-15-intel, target: x86_64-apple-darwin, build-args: "", min-macos: "" }
          - { arch: aarch64, os: macos-14, target: aarch64-apple-darwin, build-args: "--screencapturekit", min-macos: "12.3" }
    defaults:
      run:
        working-directory: client
    steps:
      - name: Cache-Variablen für vcpkg freigeben
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build-Werkzeuge installieren
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config
          curl -sSLo nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          rm -rf nasm.zip nasm-2.16.03
          nasm --version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter patchen
        shell: bash
        run: |
          patch="$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          # Der Flutter-Cache kann den Patch schon enthalten.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch ist bereits angewendet"
          else
            git apply "$patch"
          fi

      - name: Flutter-Workaround für hängende Frames
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.os }}
          workspaces: client

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: client

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten installieren
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "== $1"; tail -n 50 "$1"' _ {} \;
            exit 1
          fi

      - name: Client bauen
        env:
          MIN_MACOS: ${{ matrix.min-macos }}
          BUILD_ARGS: ${{ matrix.build-args }}
        run: |
          if [ -n "$MIN_MACOS" ]; then
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            export MACOSX_DEPLOYMENT_TARGET="$MIN_MACOS"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste $BUILD_ARGS

      - name: App prüfen
        run: |
          app=./flutter/build/macos/Build/Products/Release/VibeDesk.app
          test -x "$app/Contents/MacOS/VibeDesk"
          test -f "$app/Contents/Frameworks/liblibvibedesk.dylib" || find "$app" -name "*vibedesk*.dylib" | grep -q .
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -qx io.github.simondietschi.vibedesk

      - name: dmg erstellen
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          create_dmg="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$create_dmg"
          mkdir -p dist
          create-dmg --volname "VibeDesk" --icon "VibeDesk.app" 200 190 --hide-extension "VibeDesk.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "dist/vibedesk-${version}-${ARCH}.dmg" ./flutter/build/macos/Build/Products/Release/VibeDesk.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibedesk-macos-${{ matrix.arch }}
          path: client/dist/*.dmg
          if-no-files-found: error

  ios:
    name: iOS
    needs: bridge
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Cache-Variablen für vcpkg freigeben
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build-Werkzeuge installieren
        run: brew install nasm yasm

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter patchen
        shell: bash
        run: |
          patch="$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          # Der Flutter-Cache kann den Patch schon enthalten.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch ist bereits angewendet"
          else
            git apply "$patch"
          fi

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten installieren
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "== $1"; tail -n 50 "$1"' _ {} \;
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ios
          workspaces: client

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: client

      - name: Rust-Bibliothek bauen
        run: cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: App bauen (ohne Signatur)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          pushd flutter
          flutter build ipa --release --no-codesign
          popd
          app=flutter/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist" | grep -qx io.github.simondietschi.vibedesk
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          (cd dist && zip -qry "vibedesk-${version}-unsigned.ipa" Payload && rm -rf Payload)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibedesk-ios
          path: client/dist/*.ipa
          if-no-files-found: error

  release:
    name: Release-Entwurf erstellen
    needs: [linux, windows, android, macos, ios]
    # Läuft auch, wenn einzelne Plattformen abgewählt wurden, aber nie nach einem Fehler.
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vibedesk-*
          merge-multiple: true
          path: dist

      - name: Prüfsummen erstellen
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Als Entwurf, damit ein Release erst nach Durchsicht öffentlich wird.
      - uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          draft: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: VibeDesk ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
